<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#040404">
  <title>EGROV BeatStore</title>
  <style>html,body{margin:0;min-height:100%;background:#040404;color:#fff;font:14px Arial,sans-serif}body{display:grid;place-items:center;min-height:100vh}.status{display:flex;align-items:center;gap:10px;letter-spacing:.08em;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.25}}</style>
</head>
<body>
  <div class="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">Сканирование устройства...</span></div>
  <script>
  (() => {
    // Lightweight browser-based classification; no permissions or device data are collected.
    const ua = navigator.userAgent || '';
    const platform = navigator.userAgentData && navigator.userAgentData.platform || navigator.platform || '';
    const isIPad = /iPad/i.test(ua) || (platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isIPhone = /iPhone|iPod/i.test(ua) || isIPad;
    const isAndroid = /Android/i.test(ua);
    const target = isIPhone ? '/indexios.html' : isAndroid ? '/indexandroid.html' : '/indexpc.html';
    // A short status lets the initial entry page act as the device dispatcher.
    document.getElementById('statusText').textContent = 'Устройство найдено';
    window.location.replace(target);
  })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=/indexpc.html"></noscript>
</body>
</html>
